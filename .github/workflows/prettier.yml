name: Prettier Formatting Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Check Prettier Formatting
        # Running with "." automatically checks ALL folders in the repository
        # (TASK_1, TASK_2, TASK_3) without crashing if any are missing yet.
        # It respects the rules in .prettierignore as well!
        run: npx prettier --check .
        
